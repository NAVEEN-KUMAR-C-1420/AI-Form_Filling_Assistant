# SECURITY NOTE
# All three secrets below must be set in backend/.env before docker-compose up.
# The :? syntax makes Docker Compose fail fast with a clear error if any are
# missing, instead of silently using weak default values.
#
# Generate strong values:
#   DB_PASSWORD -> openssl rand -base64 32
#   SECRET_KEY -> openssl rand -hex 32
#   ENCRYPTION_KEY -> python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: form_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # No weak default - must be supplied via .env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}
      POSTGRES_DB: form_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - form_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: form_assistant_api
    restart: unless-stopped
    environment:
      # No weak defaults on any secret variable
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/form_assistant
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in backend/.env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in backend/.env}
      - TESSERACT_CMD=/usr/bin/tesseract
      - ENVIRONMENT=development
      - DEBUG=true
      - ENABLE_HTTPS_REDIRECT=false
      - HOST=0.0.0.0
      - PORT=8000
      - AUTO_CREATE_TABLES=true
      - ALLOWED_HOSTS=["localhost","127.0.0.1"]
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000","http://127.0.0.1:8000","chrome-extension://*"]
    volumes:
      - upload_data:/app/temp_uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - form_network

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local

networks:
  form_network:
    driver: bridge
